[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "animora"
version = "1.0.0"
description = "Command-line 3D animation and path-traced rendering (no GUI)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.21", "pillow>=8"]
license = {text = "MIT"}

[project.optional-dependencies]
yaml = ["pyyaml"]

[project.scripts]
animora = "animora.cli:main"

[tool.setuptools]
packages = ["animora", "animora.render", "animora.io"]

[tool.setuptools.package-data]
animora = ["native/*.cpp", "native/*.h", "native/*.mm", "native/*.msl"]
